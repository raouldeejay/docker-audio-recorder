
services:
  audio-recorder:
    build:
      context: https://github.com/raouldeejay/docker-audio-recorder.git
      dockerfile: Dockerfile
    container_name: docker-audio-recorder
    ports:
      - "5000:5000"
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./recordings:/app/recordings
      - /etc/asound.conf:/etc/asound.conf:ro
      - /usr/share/alsa:/usr/share/alsa:ro
    environment:
      - FLASK_ENV=production
    privileged: false
