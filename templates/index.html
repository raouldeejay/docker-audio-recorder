<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Audio Recorder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .recorder-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start {
            background: #28a745;
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-stop {
            background: #dc3545;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 6px;
            margin-top: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .status-recording {
            background: #ffd700;
            color: #333;
            animation: pulse 1s infinite;
        }

        .status-idle {
            background: #28a745;
            color: white;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .recordings-section {
            margin-top: 30px;
        }

        .recordings-section h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .recordings-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .recording-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
        }

        .recording-info {
            flex: 1;
        }

        .recording-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .recording-meta {
            font-size: 12px;
            color: #777;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 20px;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Docker Audio Recorder</h1>
        
        <div id="message" class="message"></div>

        <div class="recorder-section">
            <div class="form-group">
                <label for="filename">Filename (without extension)</label>
                <input type="text" id="filename" placeholder="my_recording">
            </div>

            <div class="button-group">
                <button class="btn-start" id="startBtn" onclick="startRecording()">Start Recording</button>
                <button class="btn-stop" id="stopBtn" onclick="stopRecording()" disabled>Stop Recording</button>
            </div>

            <div class="status">
                <span class="status-badge status-idle" id="statusBadge">● Idle</span>
            </div>
        </div>

        <div class="recordings-section">
            <h2>Recordings</h2>
            <div class="recordings-list" id="recordingsList">
                <div class="empty-state">Loading recordings...</div>
            </div>
        </div>
    </div>

    <script>
        const statusBadge = document.getElementById('statusBadge');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const filenameInput = document.getElementById('filename');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        async function getStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                startBtn.disabled = data.is_recording;
                stopBtn.disabled = !data.is_recording;
                filenameInput.disabled = data.is_recording;

                if (data.is_recording) {
                    statusBadge.textContent = '● Recording...';
                    statusBadge.className = 'status-badge status-recording';
                } else {
                    statusBadge.textContent = '● Idle';
                    statusBadge.className = 'status-badge status-idle';
                }
            } catch (error) {
                console.error('Status error:', error);
            }
        }

        async function startRecording() {
            let filename = filenameInput.value.trim();
            if (!filename) {
                filename = `recording_${new Date().toISOString().replace(/[:.]/g, '-')}`;
            }
            filename += '.wav';

            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename})
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    getStatus();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error starting recording', 'error');
                console.error(error);
            }
        }

        async function stopRecording() {
            try {
                const response = await fetch('/api/stop', {method: 'POST'});
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    getStatus();
                    loadRecordings();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error stopping recording', 'error');
                console.error(error);
            }
        }

        async function loadRecordings() {
            try {
                const response = await fetch('/api/recordings');
                const data = await response.json();
                const list = document.getElementById('recordingsList');

                if (data.recordings.length === 0) {
                    list.innerHTML = '<div class="empty-state">No recordings yet</div>';
                    return;
                }

                list.innerHTML = data.recordings.map(rec => {
                    const size = (rec.size / 1024 / 1024).toFixed(2);
                    const date = new Date(rec.created).toLocaleString();
                    return `
                        <div class="recording-item">
                            <div class="recording-info">
                                <div class="recording-name">${rec.filename}</div>
                                <div class="recording-meta">${date} • ${size} MB</div>
                            </div>
                            <button class="btn-delete" onclick="deleteRecording('${rec.filename}')">Delete</button>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading recordings:', error);
                document.getElementById('recordingsList').innerHTML = '<div class="empty-state">Error loading recordings</div>';
            }
        }

        async function deleteRecording(filename) {
            if (!confirm(`Delete ${filename}?`)) return;

            try {
                const response = await fetch(`/api/delete/${filename}`, {method: 'DELETE'});
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    loadRecordings();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error deleting recording', 'error');
                console.error(error);
            }
        }

        // Initialize
        getStatus();
        loadRecordings();
        setInterval(getStatus, 1000);
        setInterval(loadRecordings, 5000);
    </script>
</body>
</html>
